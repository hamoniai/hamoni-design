<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hamoni — Primary colour</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style>
    body { margin: 0; padding: 24px; background: var(--brand-color-bg-container); color: var(--brand-color-text); font-family: var(--brand-font-family); }
    h1 { font-size: 20px; margin: 0 0 2px; font-weight: var(--brand-font-weight-strong); }
    p.sub { margin: 0 0 20px; color: var(--brand-color-text-secondary); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .sw { border: 1px solid var(--brand-color-border-secondary); border-radius: 8px; overflow: hidden; min-width: 0; }
    .sw .chip { height: 56px; }
    .sw .lbl { padding: 8px; font-size: 11px; line-height: 1.3; color: var(--brand-color-text-secondary); font-family: var(--brand-font-family-code); }
    .roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 20px; }
    .role { border: 1px solid var(--brand-color-border-secondary); border-radius: 8px; padding: 10px; font-size: 12px; color: var(--brand-color-text-secondary); font-family: var(--brand-font-family-code); }
    .dot { width: 18px; height: 18px; border-radius: 5px; display: inline-block; vertical-align: middle; margin-right: 8px; border: 1px solid var(--brand-color-border-secondary); }
  </style>
</head>
<body>
  <h1>Primary — Purple</h1>
  <p class="sub">Authored ramp from <code>system/brand-palette.css</code></p>

  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--brand-purple-50)"></div><div class="lbl">50 · #f2e7fe</div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-purple-100)"></div><div class="lbl">100 · #dbb2ff</div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-purple-200)"></div><div class="lbl">200 · #bb86fc</div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-purple-300)"></div><div class="lbl">300 · #985eff</div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-purple-400)"></div><div class="lbl">400 · #7f39fb</div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-purple-500)"></div><div class="lbl">500 · #6200ee</div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-purple-600)"></div><div class="lbl">600 · #5600e8</div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-purple-700)"></div><div class="lbl">700 · #3700b3</div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-purple-800)"></div><div class="lbl">800 · #30009c</div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-purple-900)"></div><div class="lbl">900 · #23036a</div></div>
  </div>

  <div class="roles">
    <div class="role"><span class="dot" style="background:var(--brand-color-primary)"></span>primary</div>
    <div class="role"><span class="dot" style="background:var(--brand-color-primary-hover)"></span>primary-hover</div>
    <div class="role"><span class="dot" style="background:var(--brand-color-primary-active)"></span>primary-active</div>
    <div class="role"><span class="dot" style="background:var(--brand-color-primary-text)"></span>primary-text</div>
    <div class="role"><span class="dot" style="background:var(--brand-color-primary-bg)"></span>primary-bg</div>
    <div class="role"><span class="dot" style="background:var(--brand-color-primary-border)"></span>primary-border</div>
  </div>
</body>
</html>
